<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catch the Coffee Beans</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="alert" class="hidden">
    <div id="alertContent">
      <p id="alertText">Game over!</p>
      <button id="alertCloseBtn">Try again</button>
    </div>
  </div>

  <section id="game" class="content">
    <h2>Catch the Coffee Beans!</h2>
    <p>Each Level Is Ten Coffee Beans, Try To Get 5 Levels!</p>
    <p>There Are 2 Game Modes: Classic and Plus Mode!</p>
    <p style="font-size: 24px; font-weight: bold;">Score: <span id="score">0</span> | Level: <span id="level">1</span></p>

    <button id="classicButton">Classic Mode</button>
    <button id="plusButton">Plus Mode</button>
    <canvas id="gameCanvas" width="400" height="400" style="margin-top: 10px; border:1px solid #000; display: none;"></canvas>
  </section>

  <script src="popup.js"></script>
</body>
</html>
